# Requirements: HA-002
configuration:
  electricity_price_provider:
    name: Electricity price provider
    description: Provider ID used for electricity prices.
  home_telemetry_provider:
    name: Home telemetry provider
    description: Provider ID used for household consumption and production.
  charger_provider:
    name: Charger provider
    description: Provider ID used for charger integration.
  weather_forecast_provider:
    name: Weather forecast provider
    description: Provider ID used for weather forecasts.
  user_mode:
    name: User mode
    description: Charging behavior mode. Safe is the default.
  soc_buffer_percent:
    name: SOC buffer
    description: Extra state of charge buffer added by the selected mode.
  start_early_minutes:
    name: Start early
    description: Minutes before departure that planning should target readiness.
  allow_undercharge_risk:
    name: Allow undercharge risk
    description: Whether selected mode may accept risk of not reaching the target.
  weather_latitude:
    name: Weather latitude
    description: Latitude used for weather and solar prediction.
  weather_longitude:
    name: Weather longitude
    description: Longitude used for weather and solar prediction.
  solar_panel_tilt_degrees:
    name: Solar panel tilt
    description: Optional panel tilt in degrees for solar radiation forecasts.
  solar_panel_azimuth_degrees:
    name: Solar panel azimuth
    description: Optional panel azimuth in degrees for solar radiation forecasts.
  tibber_access_token:
    name: Tibber access token
    description: Token used to access Tibber GraphQL API.
  tibber_home_id:
    name: Tibber home selection
    description: Most users should leave this empty. Only use it if your Tibber account has multiple homes and you want to choose one.
  database_url:
    name: PostgreSQL connection URL
    description: PostgreSQL database URL used for price storage.
  departure_time:
    name: Departure time
    description: Desired daily departure time.
  minimum_soc_percent:
    name: Minimum SOC
    description: Minimum target state of charge.
  maximum_soc_percent:
    name: Maximum SOC
    description: Maximum allowed state of charge.
  battery_capacity_kwh:
    name: Battery capacity
    description: EV battery capacity in kWh.
  charger_power_kw:
    name: Charger power
    description: Charger power in kW.
  charging_efficiency:
    name: Charging efficiency
    description: Charging efficiency from 0 to 1.
network:
  3000/TCP: Web UI
