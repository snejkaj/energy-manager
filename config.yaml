# Requirements: HA-001, HA-002, HA-006, HA-007
name: Smart EV Charging Optimizer
version: 0.1.0
slug: smart_ev_charging_optimizer
description: Plans EV charging from Tibber electricity prices.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:ev-station
panel_title: EV Charging
homeassistant_api: true
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Web UI
options:
  electricity_price_provider: "mock-electricity-price"
  home_telemetry_provider: "mock-home-telemetry"
  charger_provider: "mock-charger"
  tibber_access_token: null
  tibber_home_id: ""
  database_url: "postgres://user:password@host:5432/energy_manager"
  departure_time: "07:00"
  minimum_soc_percent: 60
  maximum_soc_percent: 80
  battery_capacity_kwh: 75
  charger_power_kw: 11
  charging_efficiency: 0.9
schema:
  electricity_price_provider: str
  home_telemetry_provider: str
  charger_provider: str
  tibber_access_token: password
  tibber_home_id: str?
  database_url: str
  departure_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  minimum_soc_percent: "int(0,100)"
  maximum_soc_percent: "int(0,100)"
  battery_capacity_kwh: "float(1,)"
  charger_power_kw: "float(0,)"
  charging_efficiency: "float(0,1)"
