# Requirements: HA-001, HA-002, HA-006, HA-007, ONB-001, ONB-002, ONB-003, ONB-004
name: Smart EV Charging Optimizer
version: 0.1.0
slug: smart_ev_charging_optimizer
description: Plans EV charging from electricity prices. Starts in planning-only mode until setup is complete.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:ev-station
panel_title: EV Charging
homeassistant_api: true
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Web UI
options:
  electricity_price_provider: "mock-electricity-price"
  home_telemetry_provider: "mock-home-telemetry"
  charger_provider: "planning-only"
  vehicle_state_provider: "tesla"
  weather_forecast_provider: "open-meteo"
  user_mode: "safe"
  soc_buffer_percent: 15
  start_early_minutes: 90
  allow_undercharge_risk: false
  weather_latitude: null
  weather_longitude: null
  solar_panel_tilt_degrees: null
  solar_panel_azimuth_degrees: null
  tibber_access_token: ""
  tibber_home_id: ""
  tesla_access_token: ""
  tesla_vehicle_id: ""
  tibber_oauth_client_id: ""
  tibber_oauth_client_secret: ""
  tibber_oauth_redirect_uri: ""
  tesla_oauth_client_id: ""
  tesla_oauth_client_secret: ""
  tesla_oauth_redirect_uri: ""
  token_encryption_key: ""
  database_url: ""
  departure_time: "07:00"
  minimum_soc_percent: 60
  maximum_soc_percent: 80
  battery_capacity_kwh: 75
  charger_power_kw: 11
  charging_efficiency: 0.9
schema:
  electricity_price_provider: str
  home_telemetry_provider: str
  charger_provider: "list(planning-only|mock-charger)"
  vehicle_state_provider: "list(tesla)"
  weather_forecast_provider: str
  user_mode: "list(safe|balanced|savings)"
  soc_buffer_percent: "float(0,100)"
  start_early_minutes: "int(0,)"
  allow_undercharge_risk: bool
  weather_latitude: float?
  weather_longitude: float?
  solar_panel_tilt_degrees: float?
  solar_panel_azimuth_degrees: float?
  tibber_access_token: password
  tibber_home_id: str?
  tesla_access_token: password?
  tesla_vehicle_id: str?
  tibber_oauth_client_id: str?
  tibber_oauth_client_secret: password?
  tibber_oauth_redirect_uri: str?
  tesla_oauth_client_id: str?
  tesla_oauth_client_secret: password?
  tesla_oauth_redirect_uri: str?
  token_encryption_key: password?
  database_url: str
  departure_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  minimum_soc_percent: "int(0,100)"
  maximum_soc_percent: "int(0,100)"
  battery_capacity_kwh: "float(1,)"
  charger_power_kw: "float(0,)"
  charging_efficiency: "float(0,1)"
