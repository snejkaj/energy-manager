# Requirements: HA-001, HA-002, HA-006, HA-007, ONB-001, ONB-002, ONB-003, ONB-004
name: Energy Manager
version: 0.5.17
slug: energy-manager
description: Plans EV charging from electricity prices. Starts in planning-only mode until setup is complete.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:ev-station
panel_title: EV Charging
homeassistant_api: true
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Web UI
webui: "http://[HOST]:[PORT:3000]"
options:
  electricity_price_provider: "mock-electricity-price"
  home_telemetry_provider: "mock-home-telemetry"
  charger_provider: "planning-only"
  vehicle_state_provider: "mock-vehicle-state"
  weather_forecast_provider: "mock-weather-forecast"
  user_mode: "safe"
  tesla_region: "eu"
  tesla_vehicle_id: ""
  tesla_client_id: ""
  tesla_client_secret: ""
  # Temporary development token only. Prefer Tesla OAuth when available.
  tesla_dev_access_token: ""
  tesla_public_callback_url: ""
  tesla_dev_redirect_uri: ""
  dev_mode: false
  external_base_url: ""
  home_assistant_external_url: ""
schema:
  electricity_price_provider: str?
  home_telemetry_provider: str?
  charger_provider: str?
  vehicle_state_provider: str?
  weather_forecast_provider: str?
  user_mode: str?
  soc_buffer_percent: str?
  start_early_minutes: str?
  allow_undercharge_risk: bool?
  weather_latitude: "str?"
  weather_longitude: "str?"
  solar_panel_tilt_degrees: "str?"
  solar_panel_azimuth_degrees: "str?"
  tibber_access_token: "str?"
  tibber_home_id: "str?"
  tesla_vehicle_id: "str?"
  tesla_region: "str?"
  tesla_client_id: "str?"
  tesla_client_secret: "str?"
  tesla_dev_access_token: "str?"
  tesla_public_callback_url: "str?"
  tesla_dev_redirect_uri: "str?"
  dev_mode: bool?
  external_base_url: "str?"
  nabu_casa_url: "str?"
  home_assistant_external_url: "str?"
  tesla_allow_insecure_callback: bool?
  tibber_oauth_client_id: str?
  tibber_oauth_client_secret: password?
  tibber_oauth_redirect_uri: str?
  token_encryption_key: password?
  database_url: str?
  departure_time: str?
  minimum_soc_percent: str?
  maximum_soc_percent: str?
  battery_capacity_kwh: str?
  charger_power_kw: str?
  charging_efficiency: str?
